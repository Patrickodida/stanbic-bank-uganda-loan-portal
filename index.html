<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stanbic Bank Uganda | Loan Products</title>
    <link rel="stylesheet" href="dlac.css">
</head>
<body>
    <header class="site-header">
        <h1>Stanbic Bank Uganda</h1>
        <nav class="navbar" aria-label="Main navigation">
            <ul>
                <li><a href="index.html" class="active">Loan Products</a></li>
                <li><a href="personal-loan.html">Personal Loan Application</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero">
            <img src="hero-bank.jpg" alt="A bank adviser helping a customer with a loan application" style="height:350px;">
            <h2>Apply for Your Loan Online</h2>
        </section>

        <section class="section">
            <h2 class="title">Our Loan Products</h2>
            <div class="loan-cards">
                <article class="loan-card">
                    <h3>Personal Loan</h3>
                    <p class="rate-label">Interest rate from</p>
                    <p class="rate">19% p.a.</p>
                    <a href="personal-loan.html" class="btn">Apply Now</a>
                </article>

                <article class="loan-card">
                    <h3>Business Loan</h3>
                    <p class="rate-label">Interest rate from</p>
                    <p class="rate">21% p.a.</p>
                    <a href="#" class="btn">Apply Now</a>
                </article>

                <article class="loan-card">
                    <h3>Mortgage Loan</h3>
                    <p class="rate-label">Interest rate from</p>
                    <p class="rate">16% p.a.</p>
                    <a href="#" class="btn">Apply Now</a>
                </article>
            </div>
        </section>
    </main>

    <footer>

    </footer>
